<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Praktikum Week 2</title>
</head>
<body>
    <header>
        <h1>Asisten AI Untuk UMKM</h1>
    </header>
    <nav>
        <a href="#profile">Profile</a>
        <a href="#portofolio">Portofolio</a>
        <a href="#hobi">Hobi</a>
    </nav>
    <main>
    <section id="profile">
        <h2>Ini Adalah Profil Saya</h2>
        <p>Saya Adalah Seorang Yang Minat Pada Bidang Teknologi</p>
        <img src="images.jpg" alt="Foto Profil Saya">
    </section>
    
    <form id="formdata" action="#">
        <label for="nama">Masukkan Nama Anda</label>
        <input type="text" id="nama" name="nama" required>
        <br>
        
        <label for="nim">Masukkan NIM</label>
        <input type="text" id="nim" name="nim" required>
        <br>
        
        <label for="telepon">Masukkan Nomor Telepon</label>
        <input type="tel" id="telepon" name="telepon" required>
        
        <fieldset id="jeniskelamin">
            <legend>Jenis Kelamin</legend>
            <input type="radio" name="jenis_kelamin" id="pria" value="pria" required>
            <label for="pria">Pria</label>
            <input type="radio" name="jenis_kelamin" id="wanita" value="wanita">
            <label for="wanita">Wanita</label>
        </fieldset>
        
        <label for="alamat">Masukkan Alamat</label> <br>
        <textarea id="alamat" name="alamat" required></textarea><br>
        <label for="tanggal">Masukkan Tanggal Lahir</label>
        <input type="date" id="tanggal" name="tanggal" required>
        <br>
        <button>Kirim</button>
    </form>
    </main>
    

    <br>
    
    <footer>
        <label>Media Sosial</label>
        <br>
        <a href="#profile">Instagram</a>
        <a href="#Foto">Facebook</a>
        <br>
    </footer>
</body>
</html>
